# Netlify 배포 설정 — 프리미엄 원페이지 (정적 사이트)
# 사용: Netlify에서 "Import an existing project" → 이 폴더를 지정하면 이 설정이 자동 적용됩니다.
[build]
  publish = "."

# 정적 자산(사진·영상·폰트 파일)은 1년 캐시 — 파일명이 바뀌면 새로 내려받습니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 보안 기본 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 내부 작업 대시보드는 검색엔진에서 제외
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex"
